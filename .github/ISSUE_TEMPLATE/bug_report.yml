name: Something is broken
description: A charm that will not hang, a window that will not open, anything that went wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. The log is usually the whole answer:
        `%APPDATA%\Hangly\hangly.log` holds the last run and contains no personal
        information — see [PRIVACY.md](../../PRIVACY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it again
      placeholder: |
        1. Open Customize
        2. ...
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Hangly version
      description: About page, or right-click Hangly.exe → Properties → Details.
      placeholder: "0.9.0"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64 (most PCs)
        - ARM64 (Snapdragon, Surface Pro X and similar)
        - Not sure
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display scaling
      placeholder: "Windows 11 23H2, 150%, two monitors"
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: The log
      description: Paste `%APPDATA%\Hangly\hangly.log`, or drag the file in.
      render: text
    validations:
      required: false
