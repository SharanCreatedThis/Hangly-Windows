# Builds, packages and publishes a release.
#
# Runs only on a tag, because a release is a deliberate act: pushing to main should never
# produce one. The tag is the version — v0.9.0 packages 0.9.0 — so there is one place a
# version is decided and it is the same place the release is named.
#
# Nothing here signs anything. SignPath will not sign a project that has not released yet,
# so the first release is unsigned by construction; Docs/DISTRIBUTION.md §3 has the
# reasoning and what changes afterwards.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.rid }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-arm64
            platform: ARM64
          - rid: win-x64
            platform: x64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Read the version from the tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "::error::'${{ github.ref_name }}' is not vMAJOR.MINOR.PATCH"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # Fails here rather than after a twenty-minute build if the release was never
      # written up. The same file reaches the package and the release page.
      - name: Read the release notes
        shell: pwsh
        run: ./tools/release-notes.ps1 -Version ${{ steps.version.outputs.version }} -OutFile notes.md

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Hangly.App/Hangly.App.csproj `
            -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:HanglyAnalyticsKey=${{ secrets.HANGLY_ANALYTICS_KEY }} `
            -o publish
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install vpk
        run: dotnet tool install --global vpk --version 1.2.0

      # The channel is passed explicitly and is the runtime identifier. vpk defaults to
      # "win", which would put ARM64 and x64 on one line of releases and offer an ARM64
      # machine an x64 package. One channel per architecture; see DISTRIBUTION.md.
      - name: Package
        shell: pwsh
        run: |
          vpk pack --packId Hangly `
            --packVersion ${{ steps.version.outputs.version }} `
            --packDir publish --mainExe Hangly.exe `
            --packTitle Hangly --packAuthors sharancreatedthis `
            --outputDir releases --runtime ${{ matrix.rid }} --channel ${{ matrix.rid }} `
            --releaseNotes notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check the feed names its own channel
        shell: pwsh
        run: |
          $feed = "releases/releases.${{ matrix.rid }}.json"
          if (-not (Test-Path $feed)) {
            Write-Host "::error::$feed was not produced; the channel was not applied"
            exit 1
          }
          Get-Content $feed -Raw | Write-Host

      - uses: actions/upload-artifact@v7
        with:
          name: hangly-${{ matrix.rid }}
          path: releases/

  publish:
    name: Publish to GitHub Releases
    needs: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The release page says exactly what the app will show on its About page, because
      # both come out of the same section of CHANGELOG.md.
      - name: Read the release notes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          ./tools/release-notes.ps1 -Version $version -OutFile notes.md

          # Only the download page needs this. Someone reading the same notes on the
          # About page has already installed the thing and been warned once.
          #
          # Written a line at a time rather than as a here-string: a here-string's
          # terminator has to sit at the start of its line, and a line at the start of a
          # line inside a YAML block scalar ends the block. The workflow file stopped
          # being a workflow file.
          Add-Content notes.md ''
          Add-Content notes.md '---'
          Add-Content notes.md ''
          Add-Content notes.md '**Code signing for this project is provided by [SignPath Foundation](https://signpath.org/).**'
          Add-Content notes.md ''
          Add-Content notes.md 'This build is **not signed yet** -- the application is in progress -- so Windows will show'
          Add-Content notes.md '"Windows protected your PC" the first time you run it. Click **More info**, then **Run anyway**.'
          Add-Content notes.md 'Docs/DISTRIBUTION.md explains why, and what changes once the Foundation has signed a release.'

      - uses: actions/download-artifact@v7
        with:
          path: staged

      # Both architectures land in one release, side by side. Their feeds are named for
      # their channels, so an installed copy asks for its own and never sees the other.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: staged/**/*
          draft: true
          body_path: notes.md
